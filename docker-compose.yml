# =============================================================================
# 阅读3服务器版 —— Docker Compose 部署（本机 / VPS / NAS 通用）
# =============================================================================
#
# 这是在【任何有 Docker 的机器】上最稳妥的部署方式，也是官方推荐方式。
# 如果你有闲置的电脑、NAS、树莓派或便宜的 VPS，用这个最省事。
#
# 用法：
#   1. 复制本文件为 docker-compose.yml（或直接用）
#   2. 在同目录创建 .env 文件，内容见 .env.example
#   3. 运行： docker compose up -d
#   4. 打开 http://<本机IP>:5888
#
# =============================================================================

services:
  reader:
    # 固定 commit 标签，保证版本可复现。
    # 想升级时把 875fec84 换成新版本标签（在 cnb.cool/hectorqin/reader 查看）
    image: docker.cnb.cool/hectorqin/reader:${READER_TAG:-875fec84}
    container_name: reader
    restart: unless-stopped

    ports:
      # 左边是宿主机端口，可改成 5890 等避免冲突
      - "${HOST_PORT:-5888}:5888"

    environment:
      # --- 必填 ---
      # 签名密钥（至少 16 位）。留空则自动生成到 /data/token.secret
      READER_TOKEN_SECRET: ${READER_TOKEN_SECRET:-}
      # --- 注册控制 ---
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      INVITE_CODE: ${INVITE_CODE:-}
      # --- 目录 ---
      DATA_DIR: /data
      BOOKS_DIR: /books
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # 数据目录：数据库、账号、进度、封面缓存、密钥
      # 这个必须持久化，否则重启后账号和数据会丢失
      - ./data:/data
      # 书库目录：把你电脑上存放电子书的目录挂载进来
      # Windows 示例：  D:/books:/books
      # macOS/Linux 示例： /Users/你的用户名/books:/books
      # 末尾的 :ro 表示只读（推荐）。
      # 如果你想在网页里上传/管理书籍，改成 :rw
      - ${BOOKS_PATH:-./books}:/books:ro

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5888/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
